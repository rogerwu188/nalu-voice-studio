[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nalu-runtime"
version = "0.1.0"
description = "Runtime API for the Nalu voice-first multi-episode short-drama studio"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
nalu-runtime = "nalu_runtime.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["services/runtime_api/nalu_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
