name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal media, voice samples, or private production receipts.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Nalu version or commit
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: Does this involve paid calls, publishing, biometrics, or child safety?
      options: ["No", "Yes — I will report it privately"]
    validations:
      required: true
