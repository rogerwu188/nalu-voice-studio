name: Feature request
description: Propose a focused product improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the user and problem before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: audiences
    attributes:
      label: Audience considerations
      options:
        - label: I considered older-adult accessibility.
        - label: I considered child and guardian safety.
        - label: I considered voice-only operation.
