name: macOS release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: CFBundleShortVersionString, for example 0.2.0
        required: true
        type: string
      build_number:
        description: Monotonically increasing CFBundleVersion
        required: true
        type: string
      signed_and_notarized:
        description: Require Developer ID signing and Apple notarization
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-release-${{ inputs.version }}-${{ inputs.build_number }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Validate release identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)?$ ]]
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]
      - run: python -m pip install -e '.[dev,packaging]'
      - run: pytest -q
      - run: ruff check services tests scripts
      - run: python scripts/export-openapi.py --check
      - run: python scripts/audit_product_sop.py --json
      - run: python scripts/audit_release_acceptance.py --json
      - run: python scripts/check_qingshan_upstream.py

  build-architecture:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[packaging]'
      - run: scripts/check-macos-build-environment.sh
      - run: swift test --package-path apps/macos
      - name: Build architecture input
        env:
          NALU_RELEASE_VERSION: ${{ inputs.version }}
          NALU_BUILD_NUMBER: ${{ inputs.build_number }}
        run: scripts/build-macos-app.sh
      - run: scripts/verify-macos-release.sh
      - run: scripts/smoke-macos-bundle.sh
      - run: ditto -c -k --keepParent "dist/Nalu Voice Studio.app" "dist/Nalu-Voice-Studio-${{ matrix.architecture }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-input-${{ matrix.architecture }}
          if-no-files-found: error
          path: dist/Nalu-Voice-Studio-${{ matrix.architecture }}.zip

  release:
    needs: build-architecture
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-input-arm64
          path: .build/release-input/arm64
      - uses: actions/download-artifact@v8
        with:
          name: release-input-x86_64
          path: .build/release-input/x86_64
      - run: ditto -x -k .build/release-input/arm64/Nalu-Voice-Studio-arm64.zip .build/release-input/arm64/app
      - run: ditto -x -k .build/release-input/x86_64/Nalu-Voice-Studio-x86_64.zip .build/release-input/x86_64/app
      - name: Merge universal application
        run: scripts/merge-macos-universal.sh ".build/release-input/arm64/app/Nalu Voice Studio.app" ".build/release-input/x86_64/app/Nalu Voice Studio.app" "dist/Nalu Voice Studio.app"
      - name: Import Developer ID and notary credentials
        if: inputs.signed_and_notarized
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for required in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD NOTARY_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            [[ -n "${!required}" ]] || { echo "Missing release secret: $required" >&2; exit 1; }
          done
          keychain="$RUNNER_TEMP/nalu-signing.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          notary_key="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 -D > "$notary_key"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          xcrun notarytool store-credentials nalu-ci-notary \
            --key "$notary_key" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --keychain "$keychain"
          echo "NALU_CI_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Sign and notarize universal release
        if: inputs.signed_and_notarized
        env:
          NALU_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NALU_NOTARY_PROFILE: nalu-ci-notary
          NALU_NOTARY_KEYCHAIN: ${{ env.NALU_CI_KEYCHAIN }}
          NALU_UPDATE_PUBLIC_KEY_BASE64: ${{ secrets.NALU_UPDATE_PUBLIC_KEY_BASE64 }}
          NALU_UPDATE_CHANNEL: stable
          NALU_UPDATE_ORIGIN: ${{ secrets.NALU_UPDATE_ORIGIN }}
        run: scripts/sign-and-notarize-macos-app.sh "dist/Nalu Voice Studio.app"
      - name: Verify final universal release
        env:
          NALU_RELEASE_VERSION: ${{ inputs.version }}
          NALU_BUILD_NUMBER: ${{ inputs.build_number }}
          NALU_REQUIRE_UNIVERSAL: "true"
          NALU_REQUIRE_DEVELOPER_ID: ${{ inputs.signed_and_notarized }}
          NALU_REQUIRE_NOTARIZATION: ${{ inputs.signed_and_notarized }}
        run: scripts/verify-macos-release.sh "dist/Nalu Voice Studio.app"
      - run: scripts/smoke-macos-bundle.sh
      - run: ditto -c -k --keepParent "dist/Nalu Voice Studio.app" "dist/Nalu-Voice-Studio-macOS.zip"
      - run: shasum -a 256 "dist/Nalu-Voice-Studio-macOS.zip" > "dist/Nalu-Voice-Studio-macOS.zip.sha256"
      - name: Record release-candidate provenance
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          SIGNED: ${{ inputs.signed_and_notarized }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          artifact = pathlib.Path("dist/Nalu-Voice-Studio-macOS.zip")
          trust = json.loads(pathlib.Path(
              "dist/Nalu Voice Studio.app/Contents/Resources/update-trust.json"
          ).read_text())
          discovery = json.loads(pathlib.Path(
              "dist/Nalu Voice Studio.app/Contents/Resources/update-discovery.json"
          ).read_text())
          key = trust.get("public_key_base64", "")
          provenance = {
              "schema_version": "nalu.macos-release-provenance/v1",
              "version": os.environ["RELEASE_VERSION"],
              "build_number": os.environ["BUILD_NUMBER"],
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "signed_and_notarized_required": os.environ["SIGNED"].lower() == "true",
              "architectures": ["arm64", "x86_64"],
              "artifact": artifact.name,
              "artifact_sha256": hashlib.sha256(artifact.read_bytes()).hexdigest(),
              "update_channel": trust["channel"],
              "updates_enabled": trust["enabled"],
              "update_discovery_enabled": discovery["enabled"],
              "update_origin_sha256": (
                  hashlib.sha256(discovery["origin"].encode()).hexdigest()
                  if discovery["origin"] else None
              ),
              "update_public_key_sha256": (
                  hashlib.sha256(base64.b64decode(key)).hexdigest() if key else None
              ),
          }
          pathlib.Path("dist/release-provenance.json").write_text(
              json.dumps(provenance, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: Nalu-Voice-Studio-${{ inputs.version }}-${{ inputs.build_number }}
          if-no-files-found: error
          path: |
            dist/Nalu-Voice-Studio-macOS.zip
            dist/Nalu-Voice-Studio-macOS.zip.sha256
            dist/release-provenance.json
