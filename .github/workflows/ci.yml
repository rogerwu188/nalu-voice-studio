name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check services tests scripts/export-openapi.py scripts/real-http-smoke.py
      - run: python scripts/export-openapi.py --check
      - run: pytest -q
      - run: python scripts/real-http-smoke.py

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-macos-app.sh
