name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check services tests scripts
      - run: python scripts/export-openapi.py --check
      - run: python scripts/audit_product_sop.py --json
      - run: python scripts/audit_goal_progress.py --json
      - run: python scripts/audit_release_acceptance.py --json
      - run: python scripts/check_qingshan_upstream.py
      - name: Reproduce quarantined Qingshan candidate audit
        run: python scripts/audit_qingshan_candidate.py --json
      - name: Execute exact Qingshan registered test contract
        run: python scripts/test_qingshan_candidate.py --json
      - name: Test pinned Qingshan contract change
        working-directory: vendor/qingshan
        run: python -m unittest tools.tests.test_grouped_performance_contract
      - if: github.event_name == 'push'
        run: python scripts/check_openapi_compatibility.py --base HEAD^
      - if: github.event_name == 'pull_request'
        run: python scripts/check_openapi_compatibility.py --base origin/${{ github.base_ref }}
      - run: pytest -q
      - run: python scripts/real-http-smoke.py
      - run: python scripts/qa-macos-upgrade-rollback.py --evidence /tmp/nalu-upgrade-rollback-source.json
      - run: python scripts/qa-offline-e2e-rehearsal.py --evidence /tmp/nalu-offline-e2e-rehearsal.json
      - uses: actions/upload-artifact@v7
        with:
          name: Nalu-Voice-Studio-runtime-QA
          path: |
            /tmp/nalu-upgrade-rollback-source.json
            /tmp/nalu-offline-e2e-rehearsal.json

  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[packaging]'
      - run: scripts/check-macos-build-environment.sh
      - run: swift test --package-path apps/macos
      - run: scripts/build-macos-app.sh
      - run: scripts/verify-macos-release.sh
      - run: NALU_PUBLICATION_FIXTURE_EVIDENCE=/tmp/nalu-publication-fixture-arm64.json scripts/smoke-macos-bundle.sh
      - run: python scripts/qa-macos-staged-update.py --app "dist/Nalu Voice Studio.app" --evidence /tmp/nalu-staged-update-arm64.json
      - run: python scripts/qa-macos-upgrade-rollback.py --app "dist/Nalu Voice Studio.app" --evidence /tmp/nalu-upgrade-rollback-arm64.json
      - run: cp /tmp/nalu-upgrade-rollback-arm64.json dist/nalu-upgrade-rollback-arm64.json
      - run: cp /tmp/nalu-staged-update-arm64.json dist/nalu-staged-update-arm64.json
      - run: cp /tmp/nalu-publication-fixture-arm64.json dist/nalu-publication-fixture-arm64.json
      - run: ditto -c -k --keepParent "dist/Nalu Voice Studio.app" "dist/Nalu-Voice-Studio-macOS.zip"
      - run: shasum -a 256 "dist/Nalu-Voice-Studio-macOS.zip" > "dist/Nalu-Voice-Studio-macOS.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: Nalu-Voice-Studio-macOS-arm64
          path: |
            dist/Nalu-Voice-Studio-macOS.zip
            dist/Nalu-Voice-Studio-macOS.zip.sha256
            dist/nalu-upgrade-rollback-arm64.json
            dist/nalu-staged-update-arm64.json
            dist/nalu-publication-fixture-arm64.json

  macos-x86_64:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[packaging]'
      - run: scripts/check-macos-build-environment.sh
      - run: swift test --package-path apps/macos
      - run: scripts/build-macos-app.sh
      - run: scripts/verify-macos-release.sh
      - run: NALU_PUBLICATION_FIXTURE_EVIDENCE=/tmp/nalu-publication-fixture-x86_64.json scripts/smoke-macos-bundle.sh
      - run: python scripts/qa-macos-staged-update.py --app "dist/Nalu Voice Studio.app" --evidence /tmp/nalu-staged-update-x86_64.json
      - run: python scripts/qa-macos-upgrade-rollback.py --app "dist/Nalu Voice Studio.app" --evidence /tmp/nalu-upgrade-rollback-x86_64.json
      - run: cp /tmp/nalu-upgrade-rollback-x86_64.json dist/nalu-upgrade-rollback-x86_64.json
      - run: cp /tmp/nalu-staged-update-x86_64.json dist/nalu-staged-update-x86_64.json
      - run: cp /tmp/nalu-publication-fixture-x86_64.json dist/nalu-publication-fixture-x86_64.json
      - run: ditto -c -k --keepParent "dist/Nalu Voice Studio.app" "dist/Nalu-Voice-Studio-macOS.zip"
      - run: shasum -a 256 "dist/Nalu-Voice-Studio-macOS.zip" > "dist/Nalu-Voice-Studio-macOS.zip.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: Nalu-Voice-Studio-macOS-x86_64
          path: |
            dist/Nalu-Voice-Studio-macOS.zip
            dist/Nalu-Voice-Studio-macOS.zip.sha256
            dist/nalu-upgrade-rollback-x86_64.json
            dist/nalu-staged-update-x86_64.json
            dist/nalu-publication-fixture-x86_64.json

  macos-universal:
    runs-on: macos-15
    needs: [macos-arm64, macos-x86_64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/download-artifact@v8
        with:
          name: Nalu-Voice-Studio-macOS-arm64
          path: .build/universal/arm64
      - uses: actions/download-artifact@v8
        with:
          name: Nalu-Voice-Studio-macOS-x86_64
          path: .build/universal/x86_64
      - run: ditto -x -k .build/universal/arm64/Nalu-Voice-Studio-macOS.zip .build/universal/arm64/app
      - run: ditto -x -k .build/universal/x86_64/Nalu-Voice-Studio-macOS.zip .build/universal/x86_64/app
      - run: scripts/merge-macos-universal.sh ".build/universal/arm64/app/Nalu Voice Studio.app" ".build/universal/x86_64/app/Nalu Voice Studio.app" "dist/Nalu Voice Studio.app"
      - run: NALU_REQUIRE_UNIVERSAL=true scripts/verify-macos-release.sh
      - run: NALU_PUBLICATION_FIXTURE_EVIDENCE=/tmp/nalu-publication-fixture-universal.json scripts/smoke-macos-bundle.sh
      - run: python scripts/qa-macos-staged-update.py --app "dist/Nalu Voice Studio.app" --evidence /tmp/nalu-staged-update-universal.json
      - run: python scripts/qa-macos-upgrade-rollback.py --app "dist/Nalu Voice Studio.app" --evidence /tmp/nalu-upgrade-rollback-universal.json
      - run: cp /tmp/nalu-upgrade-rollback-universal.json dist/nalu-upgrade-rollback-universal.json
      - run: cp /tmp/nalu-staged-update-universal.json dist/nalu-staged-update-universal.json
      - run: cp /tmp/nalu-publication-fixture-universal.json dist/nalu-publication-fixture-universal.json
      - run: ditto -c -k --keepParent "dist/Nalu Voice Studio.app" "dist/Nalu-Voice-Studio-macOS.zip"
      - run: shasum -a 256 "dist/Nalu-Voice-Studio-macOS.zip" > "dist/Nalu-Voice-Studio-macOS.zip.sha256"
      - name: Verify packaged publication-learning evidence
        run: |
          python scripts/verify-packaged-publication-evidence.py \
            --report dist/nalu-publication-fixture-universal.json \
            --release-zip dist/Nalu-Voice-Studio-macOS.zip \
            --release-zip-sha256 "$(awk '{print $1}' dist/Nalu-Voice-Studio-macOS.zip.sha256)" \
            --source-commit "$GITHUB_SHA" \
            --evidence dist/nalu-publication-verification-universal.json
      - uses: actions/upload-artifact@v7
        with:
          name: Nalu-Voice-Studio-macOS
          path: |
            dist/Nalu-Voice-Studio-macOS.zip
            dist/Nalu-Voice-Studio-macOS.zip.sha256
            dist/nalu-upgrade-rollback-universal.json
            dist/nalu-staged-update-universal.json
            dist/nalu-publication-fixture-universal.json
            dist/nalu-publication-verification-universal.json
