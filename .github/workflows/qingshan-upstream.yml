name: Qingshan upstream audit

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: upstream
        run: python scripts/check_qingshan_upstream.py --check-latest
      - if: steps.upstream.outputs.update_available == 'true'
        uses: actions/github-script@v9
        env:
          LATEST_TAG: ${{ steps.upstream.outputs.latest_tag }}
          LATEST_URL: ${{ steps.upstream.outputs.latest_url }}
        with:
          script: |
            const title = `[Qingshan Upgrade] Evaluate ${process.env.LATEST_TAG}`;
            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`;
            const existing = await github.rest.search.issuesAndPullRequests({q: query});
            if (existing.data.total_count === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  `Upstream release: ${process.env.LATEST_URL}`,
                  "",
                  "Quarantine and diff this release. Update the pinned manifest and vendor snapshot only after capability hashes, Nalu contracts, model policy, migration tests, Qingshan fixtures, Runtime tests and macOS CI pass.",
                  "",
                  "Do not enable paid execution as part of an automated upgrade."
                ].join("\n")
              });
            }
